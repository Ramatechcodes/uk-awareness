<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Location Dashboard</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:Arial;background:#0f172a;color:white;padding:20px;margin:0}.wrap{max-width:1000px;margin:auto}.card{background:#1e293b;padding:15px;margin-top:15px;border-radius:12px}.live{color:#22c55e;font-weight:bold}.offline{color:#f59e0b;font-weight:bold}input,button{padding:10px;margin:5px;border-radius:7px;border:0}button{cursor:pointer}#timer{color:#38bdf8;font-weight:bold}#liveMap{height:520px;margin-top:15px;border-radius:12px;overflow:hidden}.pulse{width:18px;height:18px;border-radius:50%;background:#22c55e;border:3px solid white;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:pulse 1.5s infinite}@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}a{color:#38bdf8}.address{line-height:1.5}</style></head>
<body><div class="wrap"><h2>📍 Live Tracking Dashboard</h2><p id="timer"></p><input id="code" placeholder="Enter Access Code"><button onclick="login()">Login</button><button onclick="pay()">Pay ₦3000</button><div id="status" class="card">Not connected.</div><div id="liveMap"></div><div id="data"></div><div class="card"><h3>📩 Support</h3><a href="mailto:ramatechcode14@gmail.com">ramatechcode14@gmail.com</a></div></div>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let socket=null,liveMap=null,liveMarker=null,accuracyCircle=null,currentCode=null;const pulseIcon=L.divIcon({className:'',html:'<div class="pulse"></div>',iconSize:[24,24],iconAnchor:[12,12]});
function setStatus(text,cls=''){document.getElementById('status').innerHTML='<span class="'+cls+'">'+text+'</span>'}function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function ensureMap(lat,lng){if(!liveMap){liveMap=L.map('liveMap').setView([lat,lng],17);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(liveMap)}else liveMap.setView([lat,lng],17);if(!liveMarker)liveMarker=L.marker([lat,lng],{icon:pulseIcon}).addTo(liveMap);else liveMarker.setLatLng([lat,lng]);if(!accuracyCircle)accuracyCircle=L.circle([lat,lng],{radius:0}).addTo(liveMap);accuracyCircle.setLatLng([lat,lng]).setRadius(Number(arguments[2])||0)}
function connectLive(sessionId){if(socket)socket.disconnect();socket=io();socket.emit('join-session',sessionId,r=>{if(!r?.ok){setStatus('❌ '+(r?.error||'Unable to connect'),'offline');return}setStatus('🟢 Waiting for live GPS location…','live')});socket.on('receive-live-location',loc=>{ensureMap(loc.latitude,loc.longitude,loc.accuracy);setStatus('🟢 LIVE LOCATION ACTIVE<br>Updated: '+new Date(loc.createdAt).toLocaleTimeString('en-NG')+'<br>GPS accuracy: '+(loc.accuracy?Math.round(loc.accuracy)+' m':'unknown')+'<br>Address: '+escapeHtml(loc.address||'Updating…')+'<br><a target="_blank" href="https://www.google.com/maps?q='+loc.latitude+','+loc.longitude+'">Open in Google Maps</a>','live')});socket.on('live-location-stopped',()=>setStatus('🟠 Person stopped sharing live location.','offline'));socket.on('live-location-disconnected',()=>setStatus('🟠 Tracking page disconnected. Marker shows the last known position.','offline'))}
async function startTimer(code){const res=await fetch('/session/'+encodeURIComponent(code));const d=await res.json();if(d.error){location.href='/pay.html';return}const expires=new Date(d.expiresAt).getTime();setInterval(()=>{const diff=Math.floor((expires-Date.now())/1000);if(diff<=0){alert('Session expired.');location.href='/pay.html';return}document.getElementById('timer').innerText='Expires in: '+Math.floor(diff/60)+'m '+String(diff%60).padStart(2,'0')+'s'},1000)}
async function pay(){const email=prompt('Enter email');if(!email)return;const r=await fetch('/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const d=await r.json();if(d.error)return alert(d.error);location.href=d.paymentLink}
async function login(){const code=document.getElementById('code').value.trim();if(!code)return alert('Enter your access code.');const r=await fetch('/verify/'+encodeURIComponent(code));const d=await r.json();if(!d.ok)return alert(d.error==='expired'?'Code expired':'Invalid code');currentCode=code;startTimer(code);connectLive(d.sessionId||'');loadRegistrations(code)}
async function loadRegistrations(code){const r=await fetch('/registrations/'+encodeURIComponent(code));const d=await r.json();if(d.error)return;const box=document.getElementById('data');box.innerHTML='<div class="card"><h3>📝 Registrations</h3>'+(d.length?d.map(x=>'<div style="border-top:1px solid #334155;padding:14px 0"><b>'+escapeHtml(x.fullName)+'</b><br>Email: '+escapeHtml(x.email||'Not provided')+'<br>Phone: '+escapeHtml(x.phone||'Not provided')+'<br>Submitted: '+new Date(x.createdAt).toLocaleString('en-NG')+'<br>Location consent: '+(x.locationConsent?'Yes':'No')+(x.location?.formattedAddress?'<br><b>Registration location:</b> '+escapeHtml(x.location.formattedAddress): '')+'</div>').join(''):'No registrations yet.')+'</div>'}
</script></body></html>
