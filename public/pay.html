<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay to Access</title>
<style>body{font-family:Arial;background:#0f172a;color:white;padding:25px}.box{max-width:500px;margin:auto;background:#1e293b;padding:25px;border-radius:15px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:0;border-radius:8px}button{background:#38bdf8;font-weight:bold;cursor:pointer}</style></head>
<body><div class="box"><h2>Pay ₦3000 to Access Tracking Dashboard</h2><input type="email" id="email" placeholder="Enter email"><button onclick="pay()">Pay Now</button><p id="msg"></p></div>
<script>async function pay(){const email=document.getElementById('email').value.trim();if(!email)return alert('Enter your email');document.getElementById('msg').textContent='Creating payment…';try{const res=await fetch('/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const data=await res.json();if(data.error)throw new Error(data.error);location.href=data.paymentLink}catch(e){document.getElementById('msg').textContent='❌ '+e.message;}}</script></body></html>
